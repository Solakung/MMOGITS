<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chronicles of 8-Bit World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrapper">
    <!-- แถบสถานะด้านบน + มินิแมพ -->
    <div id="hud-top">
      <div class="hud-col">
        <div class="stat-row"><strong>Lv.<span id="lvl-txt">1</span></strong> (<span id="gold-txt">0</span>🪙)</div>
        <div class="bar-container hp"><div id="hp-bar" class="bar-fill"></div></div>
        <div class="bar-container mp"><div id="mp-bar" class="bar-fill"></div></div>
      </div>
      
      <div class="hud-col center">
        <div id="clock-txt">☀️ 12:00</div>
        <div id="zone-txt" style="color:#72dec2;">หมู่บ้าน</div>
      </div>

      <!-- เรดาร์แผนที่ย่อ (Mini-Map) -->
      <canvas id="miniMap" width="60" height="45"></canvas>
    </div>

    <!-- แถบเควสต์ -->
    <div id="quest-bar">
      📜 <strong>ภารกิจ:</strong> <span id="quest-desc">คุยกับผู้เฒ่า หรือตัดไม้ขุดแร่สร้างอาวุธ</span>
    </div>

    <!-- จอเกม 8-Bit -->
    <div id="canvas-container">
      <canvas id="gameCanvas" width="320" height="240"></canvas>
      
      <!-- หน้าต่างกระเป๋าและคราฟต์ไอเทม (กดเปิด/ปิดได้) -->
      <div id="inventory-modal" class="hidden">
        <div class="modal-header">
          <span>🎒 กระเป๋า & ร้านตีเหล็ก</span>
          <button id="btn-close-inv">✖</button>
        </div>
        <div class="inv-body">
          <div class="inv-section">
            <strong>คลังวัตถุดิบ:</strong>
            <div>ท่อนไม้: <span id="mat-wood">0</span> 🪵 | แร่เหล็ก: <span id="mat-ore">0</span> ⛏️</div>
            <div>ยาแดง: <span id="pot-hp">1</span> 🧪 <button class="btn-sm" id="btn-use-hp">ดื่ม</button> | ยาฟ้า: <span id="pot-mp">1</span> 💧 <button class="btn-sm" id="btn-use-mp">ดื่ม</button></div>
          </div>
          <div class="inv-section" style="margin-top:6px;">
            <strong>โรงตีเหล็ก (คราฟต์ของ):</strong>
            <div class="craft-row">
              <span>⚔️ ดาบเหล็ก (+10 ATK) [ใช้ 5แร่, 5ไม้]</span>
              <button class="btn-sm" id="btn-craft-sword">สร้าง</button>
            </div>
            <div class="craft-row">
              <span>🛡️ เกราะอัศวิน (+30 HP) [ใช้ 8แร่, 4ไม้]</span>
              <button class="btn-sm" id="btn-craft-armor">สร้าง</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- แชตโลก -->
    <div id="chat-box">
      <div id="log-content"></div>
    </div>

    <!-- แผงควบคุมเสมือน -->
    <div id="touch-controls">
      <div id="dpad">
        <button class="btn-dpad up" data-dir="up">▲</button>
        <button class="btn-dpad left" data-dir="left">◀</button>
        <button class="btn-dpad right" data-dir="right">▶</button>
        <button class="btn-dpad down" data-dir="down">▼</button>
      </div>

      <div id="action-grid">
        <button class="btn-act bag" id="btn-bag">🎒 ช่องเก็บของ</button>
        <button class="btn-act skill1" id="btn-spin">🌀 ดาบหมุน</button>
        <button class="btn-act skill2" id="btn-shield">🛡️ บาเรีย</button>
        <button class="btn-act skill3" id="btn-heal">🌿 ฮีล</button>
        <button class="btn-act attack" id="btn-atk">⚔️ โจมตี/เก็บ</button>
        <button class="btn-act feed" id="btn-feed">🍎 สัมพันธ์/คุย</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=7"></script>
</body>
</html>
